services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      DOWNLOAD_PASSWORD: ${DOWNLOAD_PASSWORD:-change-me}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      BODY_SIZE_LIMIT: Infinity
    volumes:
      - gd-data:/data
    ports:
      - "${APP_PORT:-3000}:3000"

  worker:
    build:
      context: .
      target: worker
    command: ["bun", "worker/index.ts"]
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      MIN_FREE_MEMORY_MB: ${MIN_FREE_MEMORY_MB:-2048}
      IDA_HOST_DIR: /opt/ida-host
      IDA_DIR: /opt/ida
      IDA_PATH: /opt/ida/idat
      IDAUSR: /opt/ida-user
      BROMA_PLUGIN_DIR: /opt/ida-user/plugins
      BROMA_REPO_URL: ${BROMA_REPO_URL:-https://github.com/Stazzical/BromaIDA.git}
      IDA_LICENSE: keyfile=/run/ida/license.hexlic
      BINDINGS_REPO_URL: ${BINDINGS_REPO_URL:-https://github.com/geode-sdk/bindings}
      BINDINGS_COMMIT: ${BINDINGS_COMMIT:-}
      BINDINGS_DIR: /bindings
    volumes:
      - gd-data:/data
      - ${IDA_HOST_DIR:-./ida}:/opt/ida-host:ro
      - ida-install:/opt/ida
      - ida-user:/opt/ida-user
      - ${IDA_LICENSE_PATH:-./license.hexlic}:/run/ida/license.hexlic:ro
      - bindings:/bindings
    depends_on:
      - app

volumes:
  gd-data:
  ida-install:
  ida-user:
  bindings:


